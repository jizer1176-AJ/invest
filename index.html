<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<script src="https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root, [data-theme="tv"] { --bg:#131722; --pn:#1e222d; --pn2:#2a2e39; --ln:#2a2e39; --tx:#d1d4dc; --sb:#787b86; --ac:#2962ff; --hv:#2a2e39; --grid:rgba(255,255,255,.05); }
  [data-theme="navy"]  { --bg:#0b1220; --pn:#111a2e; --pn2:#1a2540; --ln:#1f2a44; --tx:#dbe4f3; --sb:#7f8ba3; --ac:#3b82f6; --hv:#1a2540; --grid:rgba(255,255,255,.05); }
  [data-theme="black"] { --bg:#000000; --pn:#0e0e0e; --pn2:#1c1c1c; --ln:#222222; --tx:#eaeaea; --sb:#8a8a8a; --ac:#f0b90b; --hv:#1c1c1c; --grid:rgba(255,255,255,.05); }
  [data-theme="light"] { --bg:#ffffff; --pn:#f8f9fd; --pn2:#eef0f6; --ln:#e0e3eb; --tx:#131722; --sb:#6a6d78; --ac:#2962ff; --hv:#eef0f6; --grid:rgba(0,0,0,.06); }
  [data-theme="paper"] { --bg:#f6f1e7; --pn:#efe8da; --pn2:#e6dcc9; --ln:#d9ceb9; --tx:#3a3226; --sb:#7d715f; --ac:#b5651d; --hv:#e6dcc9; --grid:rgba(0,0,0,.06); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--tx); font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; font-size:var(--fs,13px); }
  button, select, input { font:inherit; color:var(--tx); }
  button { background:transparent; border:1px solid transparent; border-radius:6px; padding:5px 9px; cursor:pointer; white-space:nowrap; }
  button:hover { background:var(--hv); }
  button.on { background:var(--ac); color:#fff; }
  select { background:var(--pn); border:1px solid var(--ln); border-radius:6px; padding:4px 6px; }
  .up { color:var(--upc); } .dn { color:var(--dnc); } .fl { color:var(--sb); }

  /* 工具列 */
  #tb { display:flex; align-items:center; gap:6px; padding:6px 10px; border-bottom:1px solid var(--ln); background:var(--bg); position:sticky; top:0; z-index:20; flex-wrap:wrap; }
  #symbox { display:flex; align-items:baseline; gap:8px; min-width:0; }
  #nm { font-weight:700; font-size:1.15em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:200px; }
  #cd { color:var(--sb); font-size:.85em; white-space:nowrap; }
  #px { font-weight:800; font-size:1.25em; }
  #pc { font-weight:700; font-size:.92em; white-space:nowrap; }
  .search { display:flex; align-items:center; background:var(--pn); border:1px solid var(--ln); border-radius:6px; padding:0 4px 0 8px; }
  .search input { background:transparent; border:0; outline:0; width:170px; padding:6px 0; }
  .sep { width:1px; height:22px; background:var(--ln); margin:0 2px; }
  .seg { display:flex; gap:2px; }
  .seg button { padding:5px 8px; }
  .grow { flex:1; }
  #star.on { color:#f7c948; background:transparent; }

  /* 主體 */
  #main { display:grid; grid-template-columns:1fr 340px; height:calc(100vh - 47px); min-height:560px; }
  #left { display:flex; flex-direction:column; min-width:0; border-right:1px solid var(--ln); }
  #chartWrap { position:relative; flex:1; min-height:300px; display:flex; }
  #chart { position:absolute; inset:0; }
  #lg, #lgB, #lgC { position:absolute; left:10px; top:6px; right:80px; z-index:3; font-size:.85em; color:var(--sb); pointer-events:none; line-height:1.55; }
  #lg b, #lgB b, #lgC b { color:var(--tx); }
  #spin { position:absolute; right:84px; top:8px; z-index:4; font-size:.85em; color:var(--sb); background:var(--pn); border:1px solid var(--ln); border-radius:12px; padding:2px 10px; display:none; }
  #bottom { height:230px; border-top:1px solid var(--ln); display:flex; flex-direction:column; }
  .tabs { display:flex; gap:2px; flex-wrap:nowrap; padding:4px 6px; border-bottom:1px solid var(--ln); overflow-x:auto; scrollbar-width:none; flex:0 0 auto; }
  .tabs::-webkit-scrollbar { display:none; }
  .tabs button { color:var(--sb); padding:6px 10px; border-radius:6px; }
  #bottom.min { height:auto; } #bottom.min #bp { display:none; }
  .tabs button.on { color:var(--tx); background:var(--pn2); font-weight:700; }
  #bp { flex:1; overflow:auto; padding:10px 14px; }
  #cats { flex-wrap:wrap; }
  #side { display:flex; flex-direction:column; min-height:0; background:var(--bg); }
  #mhead { padding:6px 10px; font-size:.85em; color:var(--sb); border-bottom:1px solid var(--ln); }
  #mlist { flex:1; overflow:auto; min-height:120px; }
  .mrow { display:grid; grid-template-columns:24px 1fr auto 72px; gap:6px; padding:7px 10px; cursor:pointer; align-items:center; border-bottom:1px solid var(--ln); }
  .mrow:hover { background:var(--hv); }
  .mrow.cur { background:var(--pn2); box-shadow:inset 3px 0 0 var(--ac); }
  .mrow .n { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mrow .s { color:var(--sb); font-size:.8em; }
  .mrow .p { text-align:right; font-variant-numeric:tabular-nums; }
  .mrow .c { text-align:right; font-weight:700; font-variant-numeric:tabular-nums; }
  .mrow .x { color:var(--sb); font-size:.78em; text-align:right; }
  .mh { display:grid; grid-template-columns:24px 1fr auto 72px; gap:6px; padding:4px 10px; color:var(--sb); font-size:.78em; border-bottom:1px solid var(--ln); }
  #detail { border-top:1px solid var(--ln); padding:10px 12px; max-height:46%; overflow:auto; }
  .kv { display:grid; grid-template-columns:1fr 1fr; gap:2px 14px; }
  .kv div { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px dashed var(--ln); font-size:.92em; }
  .kv span:first-child { color:var(--sb); }
  h4 { margin:2px 0 8px; font-size:1em; }
  .big { font-size:1.3em; font-weight:800; }
  .note { color:var(--sb); font-size:.85em; line-height:1.55; }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:6px 4px; border-bottom:1px solid var(--ln); text-align:center; }
  th { color:var(--sb); font-weight:600; font-size:.88em; }
  td:first-child, th:first-child { text-align:left; }
  .plan { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .plan > div { border-radius:8px; padding:10px; border:1px solid var(--ln); background:var(--pn); }
  .plan p { margin:4px 0; display:flex; justify-content:space-between; }
  .calc { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:10px; }
  .calc input, .calc select { width:100px; background:var(--pn); border:1px solid var(--ln); border-radius:6px; padding:4px 6px; }
  .ev { display:flex; gap:10px; padding:7px 0; border-bottom:1px solid var(--ln); }
  .ev .d { width:52px; font-weight:700; } .ev .bar { width:3px; border-radius:2px; }
  .tag { display:inline-block; padding:1px 7px; border-radius:10px; font-size:.78em; font-weight:700; }
  .rng { position:relative; height:6px; border-radius:3px; background:linear-gradient(90deg,var(--dnc),var(--sb),var(--upc)); margin:8px 0 4px; opacity:.85; }
  .rng i { position:absolute; top:-4px; width:3px; height:14px; background:var(--tx); border-radius:2px; }
  .domb { display:flex; height:10px; border-radius:5px; overflow:hidden; margin:6px 0 4px; }
  .lgd { display:flex; flex-wrap:wrap; gap:4px 10px; font-size:.78em; }
  .lgd i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:3px; }

  .plg { position:absolute; left:10px; z-index:3; font-size:.82em; color:var(--sb); pointer-events:none; white-space:nowrap; }
  .ik { pointer-events:auto; cursor:help; border-bottom:1px dotted currentColor; }
  .ik:hover { filter:brightness(1.3); }
  #lg .ik { margin-right:2px; }
  .rk { color:var(--sb); font-size:.8em; text-align:center; }
  .dh { cursor:grab; touch-action:none; font-size:1em; letter-spacing:-2px; padding:6px 0; }
  .mrow.drag { opacity:.75; background:var(--pn2); outline:1px dashed var(--ac); }
  .ixs { display:flex; flex-wrap:wrap; gap:4px 10px; margin-bottom:4px; } .ix { cursor:pointer; color:var(--tx); }
  #paneA, #paneB, #paneC { position:relative; flex:1 1 0; min-width:0; min-height:0; overflow:hidden; }
  #paneB, #paneC { display:none; border-left:1px solid var(--ln); flex-direction:column; }
  body.split #paneB, body.split3 #paneC { display:flex; }
  body.split #paneA.act, body.split #paneB.act, body.split #paneC.act { box-shadow:inset 0 0 0 2px var(--ac); }
  .xbar { display:flex; align-items:center; gap:6px; padding:4px 8px; border-bottom:1px solid var(--ln); flex-wrap:wrap; font-size:.9em; }
  .xbar input { width:110px; background:var(--pn); border:1px solid var(--ln); border-radius:6px; padding:3px 6px; }
  .xtfs button { padding:3px 6px; }
  .xchart { position:relative; flex:1; min-height:0; }
  #cdn, #cdnB, #cdnC { position:absolute; right:0; z-index:4; color:#fff; font-size:11px; text-align:center; padding:1px 0; display:none; pointer-events:none; font-variant-numeric:tabular-nums; }
  .tvw { position:absolute; inset:0; z-index:8; background:var(--bg); display:none; }
  .tvbar { height:34px; display:flex; align-items:center; gap:10px; padding:0 10px; border-bottom:1px solid var(--ln); }
  .tvbar button { margin-left:auto; border:1px solid var(--ln); }
  .cxrow { display:grid; grid-template-columns:24px 1fr auto 72px; gap:6px; padding:6px 10px; cursor:pointer; align-items:center; border-bottom:1px solid var(--ln); background:var(--pn); }
  .cxrow:hover { background:var(--hv); }
  .mrow0.drag { opacity:.7; outline:1px dashed var(--ac); }
  .sec { padding:5px 10px; font-size:.8em; color:var(--ac); font-weight:700; background:var(--pn); border-bottom:1px solid var(--ln); display:flex; align-items:center; gap:6px; }
  .ebtn { font-size:.85em; padding:3px 8px; border:1px solid var(--ln); }
  .del { color:#f23645; cursor:pointer; padding:2px 6px; }
  #sug { position:absolute; top:100%; left:0; right:0; min-width:280px; z-index:60; background:var(--pn); border:1px solid var(--ln); border-radius:8px; margin-top:4px; box-shadow:0 8px 24px rgba(0,0,0,.35); display:none; max-height:60vh; overflow:auto; }
  .sg { display:flex; align-items:center; gap:6px; padding:7px 10px; cursor:pointer; border-bottom:1px solid var(--ln); }
  .sg:hover, .sg.on { background:var(--hv); }
  #tip { position:fixed; z-index:70; width:min(320px,90vw); background:var(--pn); border:1px solid var(--ln); border-radius:10px; padding:10px 12px; box-shadow:0 8px 30px rgba(0,0,0,.35); display:none; font-size:.92em; }
  .fup { animation:fu .6s; } .fdn { animation:fd .6s; }
  @keyframes fu { 0% { background:rgba(242,54,69,.35); } 100% { background:transparent; } }
  @keyframes fd { 0% { background:rgba(8,153,129,.35); } 100% { background:transparent; } }
  /* 浮動視窗 */
  .pop { position:fixed; z-index:50; background:var(--pn); border:1px solid var(--ln); border-radius:10px; box-shadow:0 8px 30px rgba(0,0,0,.35); padding:12px; display:none; }
  #indPop { width:250px; }
  #indPop label { display:flex; align-items:center; gap:8px; padding:5px 2px; cursor:pointer; }
  #indPop i { width:14px; height:3px; border-radius:2px; display:inline-block; }
  #setPop { left:50%; top:50%; transform:translate(-50%,-50%); width:min(420px,92vw); max-height:88vh; overflow:auto; }
  #setPop h5 { margin:12px 0 6px; color:var(--sb); font-weight:600; }
  .opts { display:flex; flex-wrap:wrap; gap:6px; }
  .opts button { border:1px solid var(--ln); }
  .sw { display:inline-block; width:16px; height:16px; border-radius:4px; vertical-align:-3px; margin-right:6px; border:1px solid rgba(128,128,128,.4); }
  #mask { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:40; display:none; }
  #msg { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); z-index:60; background:#ff9800; color:#111; padding:8px 14px; border-radius:8px; font-weight:600; display:none; max-width:90vw; }

  /* 手機 */
  @media (max-width: 820px) {
    #tb { gap:4px; padding:6px 8px; position:relative; }
    #lg { font-size:.72em; right:56px; }
    #lg br + span ~ span { }
    #symbox { flex:1 1 100%; order:0; }
    #pcwrap { margin-left:auto; text-align:right; }
    .search { order:1; flex:1; } .search input { width:100%; }
    #star, #setBtn { order:1; }
    #tfs { order:2; flex:1 1 100%; overflow-x:auto; } #tfs button { flex:1; }
    #tools { order:3; flex:1 1 100%; display:flex; gap:4px; }
    .sep, .grow { display:none; }
    #main { display:block; height:auto; }
    #left { border-right:0; }
    #chartWrap { height:64vh; flex:none; flex-direction:column; }
    body.split #chartWrap { height:84vh; }
    #paneB, #paneC { border-left:0; border-top:1px solid var(--ln); }
    body.split3 #paneC { display:none; }
    #bottom { height:auto; }
    #bp { max-height:none; overflow:visible; }
    #side { border-top:1px solid var(--ln); }
    #mlist { max-height:48vh; }
    #detail { max-height:none; }
    .plan { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div id="tb">
  <div id="symbox"><span id="nm">載入中…</span><span id="cd"></span><span id="pcwrap"><span id="px"></span> <span id="pc"></span></span></div>
  <div class="search" style="position:relative"><div id="sug"></div><input id="q" autocomplete="off" placeholder="搜尋：2330、NVDA、BTC、TRUMP、TRUMP.P（永續）" enterkeyhint="search"><button id="go">🔍</button></div>
  <button id="star" title="加入／移除追蹤">☆</button>
  <span class="sep"></span>
  <div class="seg" id="tfs"></div>
  <span class="sep"></span>
  <div id="tools" class="seg">
    <select id="ctype" title="圖表類型">
      <option value="candle">K 線</option><option value="hollow">空心 K 線</option><option value="bar">美國線</option>
      <option value="ha">平均 K（HA）</option><option value="line">折線</option><option value="area">面積</option>
    </select>
    <button id="indBtn">📊 指標</button>
    <button id="logBtn" title="對數座標">Log</button>
    <button id="fitBtn" title="顯示全部">⤢</button>
    <button id="drawBtn" title="畫水平線、趨勢線">✏️ 畫線</button>
    <button id="splitBtn" title="分割畫面（電腦最多 3 個、手機 2 個）">▥ 分割</button>
  </div>
  <span class="grow"></span>
  <button id="setBtn" title="外觀設定">⚙️ 外觀</button>
</div>

<div id="main">
  <div id="left">
    <div id="chartWrap"><div id="paneA"><div id="lg"></div><div id="plgs"></div><div id="cdn"></div><div id="spin">⏳ 更新中</div><div id="chart"></div></div><div id="paneB" class="px"><div id="bBar" class="xbar"><span id="bName" style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></span><input id="bQ" placeholder="第二個商品"><button id="bGo">🔍</button><div class="seg xtfs" id="bTfs"></div><span id="bSpin" class="note" style="display:none">⏳</span></div><div id="chartB" class="xchart"><div id="lgB"></div><div id="plgsB"></div><div id="cdnB"></div><div id="chartB2" style="position:absolute;inset:0"></div></div></div><div id="paneC" class="px"><div id="cBar" class="xbar"><span id="cName" style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></span><input id="cQ" placeholder="第三個商品"><button id="cGo">🔍</button><div class="seg xtfs" id="cTfs"></div><span id="cSpin" class="note" style="display:none">⏳</span></div><div id="chartC" class="xchart"><div id="lgC"></div><div id="plgsC"></div><div id="cdnC"></div><div id="chartC2" style="position:absolute;inset:0"></div></div></div></div>
    <div id="bottom"><div class="tabs" id="btabs"></div><div id="bp"></div></div>
  </div>
  <aside id="side">
    <div class="tabs" id="cats"></div>
    <div id="mhead"></div>
    <div class="mh"><span>#</span><span>商品</span><span style="text-align:right">最新價</span><span style="text-align:right">漲跌</span></div>
    <div id="mlist"></div>
    <div id="detail"></div>
  </aside>
</div>

<div id="mask"></div>
<div id="indPop" class="pop"></div>
<div id="setPop" class="pop"></div>
<div id="drawPop" class="pop" style="width:300px"></div>
<div id="msg"></div>
<div id="tip"></div>

<script>
var QS = {}; try { location.search.replace(/^\?/, '').split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) QS[p[0]] = decodeURIComponent((p[1] || '').replace(/\+/g, ' ')); }); } catch (e) {}
function tv(x, k) { return x.charAt(0) === '\x3C' ? (QS[k] || '') : x; }   // 放在外部網站時，改從網址讀參數
var TOKEN = tv('<?= token ?>', 't'), SYM = tv('<?= sym ?>', 's').replace(/^~/, '^'), TFP = tv('<?= tf ?>', 'tf'), CAT0 = tv('<?= cat ?>', 'c'), VIEW0 = tv('<?= view ?>', 'v'), TF = TFP || '1d';
var GAS = !!(window.google && google.script && google.script.run), API = QS.api || '';
var TFS = [['5m','5分'],['15m','15分'],['30m','30分'],['1h','1時'],['4h','4時'],['1d','日'],['1wk','週']];
var CATS = [['watch','⭐ 自選'],['us','美股'],['tw','台股'],['crypto','加密貨幣'],['perp','永續合約'],['fx','法定貨幣'],['idx','重要指數'],['cmd','原物料']];
var BT = [['sum','綜合判讀'],['mtf','多週期共振'],['macro','大趨勢'],['news','新聞'],['ai','AI 解讀'],['fut','台指期'],['vol','波動數據'],['plan','交易計畫'],['lv','支撐壓力'],['desc','指標介紹'],['evs','重要事件']];
var IND = [['ma5','MA5','#f7c948'],['ma20','MA20','#ff7043'],['ma60','MA60','#ab47bc'],['ma120','MA120','#26c6da'],['ma240','MA240','#4db6ac'],['bb','布林通道','#5b8def'],['bmsb','牛市支撐帶','#ff9800'],['d200','200 日均線','#e91e63'],['vegas','維加斯通道','#00bcd4'],
  ['vol','成交量'],['macd','MACD'],['rsi','RSI'],['kd','KD'],['lv','支撐壓力線'],['plan','停損線'],['mk','金叉／死叉標記']];
var THEMES = [['tv','經典深色','#131722'],['navy','深海藍','#0b1220'],['black','純黑','#000000'],['light','明亮','#ffffff'],['paper','護眼米色','#f6f1e7']];
var DEF = { theme:'tv', color:'tw', ctype:'candle', fs:13, grid:1, log:0, ind:{ ma5:1, ma20:1, ma60:1, ma120:0, ma240:1, bb:1, bmsb:0, d200:0, vegas:0, vol:1, macd:1, rsi:1, kd:0, lv:1, plan:0, mk:1 } };
var USERTF = false, P = load_(), D = null, W = null, MTF = null, MTFKEY = '', CAT = '', MK = {}, DC = {}, EVS = null, chart = null, BTAB = 'sum', SEQ = 0;
var $ = function (id) { return document.getElementById(id); };

/* ---------- 偏好設定 ---------- */
function load_() { var p = null; try { p = JSON.parse(localStorage.getItem('iaPref') || 'null'); } catch (e) {} return merge_(p); }
function merge_(p) { var o = JSON.parse(JSON.stringify(DEF)); if (p) { for (var k in p) if (k !== 'ind') o[k] = p[k]; if (p.ind) for (var j in p.ind) o.ind[j] = p.ind[j]; } if (o.split === true) o.split = 2; return o; }
function save_(remote) {
  try { localStorage.setItem('iaPref', JSON.stringify(P)); } catch (e) {}
  if (remote && W && W.login) { clearTimeout(save_.t); save_.t = setTimeout(function () { var p = JSON.parse(JSON.stringify(P)); run('webPref', [TOKEN, p], function () {}, true); }, 800); }
}
function applyTheme() {
  document.documentElement.setAttribute('data-theme', P.theme);
  var tw = P.color === 'tw', up = tw ? '#f23645' : '#089981', dn = tw ? '#089981' : '#f23645';
  document.documentElement.style.setProperty('--upc', up); document.documentElement.style.setProperty('--dnc', dn);
  document.documentElement.style.setProperty('--fs', P.fs + 'px');
}
function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

/* ---------- 共用 ---------- */
function fmt(x, dp) { if (x == null || isNaN(x)) return '—'; if (dp == null) dp = D ? D.info.dp : 2; return Number(x).toLocaleString('en-US', { minimumFractionDigits: dp, maximumFractionDigits: dp }); }
function big(x) { if (!x) return '—'; var a = Math.abs(x); return a >= 1e12 ? (x / 1e12).toFixed(2) + ' 兆' : a >= 1e8 ? (x / 1e8).toFixed(1) + ' 億' : a >= 1e4 ? (x / 1e4).toFixed(1) + ' 萬' : fmt(x, 0); }
