<style>

  .pstar { padding:2px 6px; font-size:1.05em; }

  .cxrow { display:grid; grid-template-columns:24px 1fr auto 72px; gap:6px; padding:6px 10px; cursor:pointer; align-items:center; border-bottom:1px solid var(--ln); background:var(--pn); }

  .sg { display:flex; align-items:center; gap:6px; padding:7px 10px; cursor:pointer; border-bottom:1px solid var(--ln); }
  .sg:hover, .sg.on { background:var(--hv); }
  #grid { position:fixed; inset:0; z-index:30; background:var(--bg); flex-direction:column; overflow:hidden; max-width:100vw; }
  .gbar { display:flex; align-items:center; gap:8px; padding:8px 10px; border-bottom:1px solid var(--ln); flex-wrap:wrap; }
  #gTabs { display:none; }
  #gBody { flex:1; overflow:auto; display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); align-items:start; }
  .gcol { border-right:1px solid var(--ln); min-width:0; }
  .gch { position:sticky; top:0; z-index:3; background:var(--pn); padding:6px 10px; font-weight:700; border-bottom:1px solid var(--ln); }
  .gcard { border-bottom:1px solid var(--ln); padding:6px 0 0; }

  .gpx { font-size:1.05em; } .glg { padding:2px 10px; min-height:1.4em; font-size:.8em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .gchart { height:380px; position:relative; }
  .gerow { display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:1px solid var(--ln); }
  .gtop, .gdh { cursor:pointer; color:var(--sb); padding:0 6px; font-size:1.15em; touch-action:none; }
  .gerow.drag { outline:1px dashed var(--ac); background:var(--pn2); opacity:.35; }
  .gghost { position:fixed; z-index:9999; pointer-events:none; opacity:.92; background:var(--pn); border:1px solid var(--ac); border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.45); transform:scale(1.02); }
  .gerow .gx { color:var(--sb); padding:4px 6px; cursor:pointer; border-radius:6px; } .gerow .gx:hover { color:#ef5350; background:var(--pn2); }
  .gerow .gtop, .gerow .gdh { padding:4px 6px; cursor:pointer; border-radius:6px; } .gerow .gdh { cursor:grab; touch-action:none; }
  .gsug { position:absolute; top:100%; left:0; right:0; z-index:5; background:var(--pn); border:1px solid var(--ln); border-radius:8px; display:none; max-height:40vh; overflow:auto; }
  @media (max-width: 820px) {
    #gTabs { display:flex; }
    #gBody { display:flex; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory; }
    .gcol { flex:0 0 100%; width:100%; max-width:100vw; scroll-snap-align:start; scroll-snap-stop:always; overflow-y:auto; overflow-x:hidden; height:100%; border-right:0; }
    .gbar { flex-wrap:nowrap; } .gbar > * { flex-shrink:1; min-width:0; }
    .gch { display:none; }
    .gchart { height:calc((100vh - 120px) / 2 - 56px); min-height:220px; }   /* 一個畫面放兩張，其餘往下滑 */
  }

  .fup { animation:fu .6s; } .fdn { animation:fd .6s; }
  @keyframes fu { 0% { background:rgba(242,54,69,.35); } 100% { background:transparent; } }
  @keyframes fd { 0% { background:rgba(8,153,129,.35); } 100% { background:transparent; } }
  /* 浮動視窗 */
  .dwcv { position:absolute; inset:0; pointer-events:none; z-index:5; }

  .dwc { position:relative; display:inline-block; width:26px; height:24px; cursor:pointer; } .dwc input { position:absolute; inset:0; opacity:0; cursor:pointer; } .dwc i { position:absolute; inset:3px; border-radius:4px; border:1px solid var(--ln); }
  .dwgrid { display:grid; grid-template-columns:repeat(3, 1fr); gap:4px; }

  #backChip { position:fixed; left:50%; transform:translateX(-50%); bottom:18px; z-index:70; display:flex; gap:4px; background:var(--pn); border:1px solid var(--ac); border-radius:22px; padding:4px; box-shadow:0 6px 24px rgba(0,0,0,.45); }

  /* 手機 */
  @media (max-width: 820px) {
    #tb { gap:4px; padding:6px 8px; position:relative; }

</style>
</head>

<script>
var QS = {}; try { location.search.replace(/^\?/, '').split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) QS[p[0]] = decodeURIComponent((p[1] || '').replace(/\+/g, ' ')); }); } catch (e) {}
function tv(x, k) { return x.charAt(0) === '\x3C' ? (QS[k] || '') : x; }   // 放在外部網站時，改從網址讀參數
var TOKEN = tv('<?= token ?>', 't'), SYM = tv('<?= sym ?>', 's').replace(/^~/, '^'), TFP = tv('<?= tf ?>', 'tf'), CAT0 = tv('<?= cat ?>', 'c'), VIEW0 = tv('<?= view ?>', 'v'), TF = TFP || '1d';
var GAS = !!(window.google && google.script && google.script.run), API = QS.api || '';
var TFS = [['5m','5分'],['15m','15分'],['30m','30分'],['1h','1時'],['4h','4時'],['1d','日'],['1wk','週']];
var CATS = [['watch','⭐ 自選'],['us','美股'],['tw','台股'],['crypto','加密貨幣'],['perp','永續合約'],['chain','⛓️ 鏈上數據'],['macro','🏛️ 美國總經'],['cmd','🛢️ 原物料'],['idx','重要指數'],['fx','法定貨幣']];
var BT = [['sum','綜合判讀'],['mtf','多週期共振'],['macro','大趨勢'],['news','新聞'],['ai','AI 解讀'],['fut','台指期'],['vol','波動數據'],['plan','交易計畫'],['lv','支撐壓力'],['desc','指標介紹'],['evs','重要事件']];
var IND = [['ma5','MA5','#f7c948'],['ma20','MA20','#ff7043'],['ma60','MA60','#ab47bc'],['ma120','MA120','#26c6da'],['ma240','MA240','#4db6ac'],['bb','布林通道','#5b8def'],['bmsb','牛市支撐帶','#ff9800'],['d200','200 日均線','#e91e63'],['vegas','維加斯通道','#00bcd4'],
  ['vol','成交量'],['macd','MACD'],['rsi','RSI'],['kd','KD'],['lv','支撐壓力線'],['plan','停損線'],['mk','金叉／死叉標記']];
var THEMES = [['tv','經典深色','#131722'],['navy','深海藍','#0b1220'],['black','純黑','#000000'],['light','明亮','#ffffff'],['paper','護眼米色','#f6f1e7']];
var DEF = { theme:'tv', color:'tw', ctype:'candle', fs:13, grid:1, log:0, ind:{ ma5:1, ma20:1, ma60:1, ma120:0, ma240:1, bb:1, bmsb:0, d200:0, vegas:0, vol:1, macd:1, rsi:1, kd:0, lv:1, plan:0, mk:1 } };
var USERTF = false, P = load_(), D = null, W = null, MTF = null, MTFKEY = '', CAT = '', MK = {}, DC = {}, EVS = null, chart = null, BTAB = 'sum', SEQ = 0;
var $ = function (id) { return document.getElementById(id); };

/* ---------- 偏好設定 ---------- */
function load_() { var p = null; try { p = JSON.parse(localStorage.getItem('iaPref') || 'null'); } catch (e) {} return merge_(p); }
function merge_(p) { var o = JSON.parse(JSON.stringify(DEF)); if (p) { for (var k in p) if (k !== 'ind') o[k] = p[k]; if (p.ind) for (var j in p.ind) o.ind[j] = p.ind[j]; } if (o.split === true) o.split = 2; return o; }
function save_(remote) {
  try { localStorage.setItem('iaPref', JSON.stringify(P)); } catch (e) {}
  if (remote && W && W.login) { clearTimeout(save_.t); save_.t = setTimeout(function () { var p = JSON.parse(JSON.stringify(P)); run('webPref', [TOKEN, p], function () {}, true); }, 800); }
}
function applyTheme() {
  document.documentElement.setAttribute('data-theme', P.theme);
  var tw = P.color === 'tw', up = tw ? '#f23645' : '#089981', dn = tw ? '#089981' : '#f23645';
  document.documentElement.style.setProperty('--upc', up); document.documentElement.style.setProperty('--dnc', dn);
  document.documentElement.style.setProperty('--fs', P.fs + 'px');
}
function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

/* ---------- 共用 ---------- */
function fmt(x, dp) { if (x == null || isNaN(x)) return '—'; if (dp == null) dp = D ? D.info.dp : 2; return Number(x).toLocaleString('en-US', { minimumFractionDigits: dp, maximumFractionDigits: dp }); }
function big(x) { if (!x) return '—'; var a = Math.abs(x); return a >= 1e12 ? (x / 1e12).toFixed(2) + ' 兆' : a >= 1e8 ? (x / 1e8).toFixed(1) + ' 億' : a >= 1e4 ? (x / 1e4).toFixed(1) + ' 萬' : fmt(x, 0); }
function pct(x) { return x == null || isNaN(x) ? '—' : (x > 0 ? '+' : '') + x.toFixed(2) + '%'; }
function cls(x) { return x > 0 ? 'up' : x < 0 ? 'dn' : 'fl'; }
function tcol(s) { return /多|強/.test(s || '') ? 'var(--upc)' : /空|弱/.test(s || '') ? 'var(--dnc)' : 'var(--sb)'; }
function oc(c) { return /^#(555|666|777|888|999)/i.test(c || '') ? 'var(--sb)' : c; }
function toast(t) { var m = $('msg'); m.textContent = t; m.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { m.style.display = 'none'; }, 3500); }
function run(fn, args, ok, quiet) {
  var fail = function (e) { $('spin').style.display = 'none'; if (e && e.message === 'skip') return; if (!quiet) toast('⚠️ ' + (e && e.message || e)); };
  if (GAS) { var r = google.script.run.withSuccessHandler(ok).withFailureHandler(fail); r[fn].apply(r, args); return; }
  if (!API) { fail('缺少 api 參數，請從 LINE 的按鈕開啟'); return; }
  var qa = encodeURIComponent(JSON.stringify(args)), big = qa.length > 1800;   // 資料太大（例如畫線）改用 POST
  fetch(big ? API : API + '?p=api&fn=' + fn + '&a=' + qa, big ? { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ p: 'api', fn: fn, a: args }) } : undefined).then(function (x) { return x.json(); })
    .then(function (j) { if (j && j.__error) fail(j.__error); else ok(j); })['catch'](fail);
}
function each(sel, f) { Array.prototype.forEach.call(document.querySelectorAll(sel), f); }

/* ---------- 載入資料（含快取與預先載入）---------- */
function load(sym, tf, opt) {
  opt = opt || {};
  if (sym) SYM = sym; if (tf) TF = tf;
  var key = (SYM + '|' + TF).toUpperCase(), c = DC[key], my = ++SEQ;
  if (c && !opt.force) { show(c.d); if (Date.now() - c.at < 60000) return; }
  else if (!opt.silent) $('spin').style.display = 'block';
  run('webData', [TOKEN, SYM, TF], function (d) {
    if (my !== SEQ && !opt.silent) return;
    $('spin').style.display = 'none';
    if (d.error) { if (!opt.silent) toast('⚠️ ' + d.error); if (!D) $('nm').textContent = '查無資料'; if (!CAT) setCat('watch'); return; }
    DC[(SYM + '|' + d.tf).toUpperCase()] = DC[(d.info.key + '|' + d.tf).toUpperCase()] = { d: d, at: Date.now() };
    if (my === SEQ) show(d);
  }, opt.silent);
}
function paneLocked() { return P.plock == null ? innerWidth < 820 : !!+P.plock; }   // 手機預設鎖定
function lockUI() {
  var lk = paneLocked(); $('lockBtn').textContent = (lk ? '🔒' : '🔓') + ' 分隔線'; $('lockBtn').className = lk ? 'on' : '';
  panes().forEach(function (cx) { try { cx.chart.applyOptions({ layout: { panes: { enableResize: !lk } } }); } catch (e) {} });
}
setTimeout(function () { try { lockUI(); } catch (e) {} }, 800);
function setTitle() {
  try {
    if (GR.on) { document.title = '多張圖表｜投資助理'; return; }
    var d = focusD(); if (!d) return; var q = d.q, ttl = d.info.name + ' ' + fmt(q.price, d.info.dp) + ' ' + (q.pct > 0 ? '▲' : q.pct < 0 ? '▼' : '') + pct(q.pct) + '｜投資助理';
    if (document.title !== ttl) document.title = ttl;
  } catch (e) {}
}
setInterval(setTitle, 500);   // 分頁標題每 0.5 秒跟著藍框那張圖更新（背景分頁也會更新）
var PXT = {};
function pxSync(d, c, old) {
  var q = d.q, dp = d.info.dp, keys = [d.info.key];
  if (d.info.market === 'CRYPTO') { var b0 = String(d.info.code || '').replace(/\.P$/, '').replace(/-USD$/, ''); keys.push(/-PERP$/.test(d.info.sym) ? b0 + '.P' : b0 + '-USD'); }
  keys.forEach(function (k) { PXT[k] = Date.now(); });
  each(keys.map(function (k) { return '#mlist .mrow[data-k="' + k + '"]'; }).join(','), function (el) {
    var p = el.querySelector('.p'), cc = el.querySelector('.c'); if (!p) return; el.setAttribute('data-px', c);
    p.textContent = fmt(c, dp); if (cc && !EDIT) { cc.textContent = pct(q.pct); cc.className = 'c ' + cls(q.pct); }
    if (old && c !== old) { p.classList.remove('fup', 'fdn'); void p.offsetWidth; p.classList.add(c > old ? 'fup' : 'fdn'); }
  });
  if (DF === d && $('dPx')) {   // 右下角資訊
    $('dPx').textContent = fmt(c, dp); $('dPx').className = 'big ' + cls(q.chg);
    $('dPc').textContent = (q.chg > 0 ? '+' : '') + fmt(q.chg, dp) + '（' + pct(q.pct) + '）'; $('dPc').className = cls(q.chg);
    if ($('dPrev')) $('dPrev').textContent = fmt(q.prev, dp); if ($('dHi') && q.high != null) $('dHi').textContent = fmt(q.high, dp); if ($('dLo') && q.low != null) $('dLo').textContent = fmt(q.low, dp);
    if ($('dUpd')) $('dUpd').textContent = new Date().toLocaleTimeString('zh-TW', { hour12: false });
  }
}
function show(d) {
  var nl = { s: d.info.key, tf: d.tf }, isCard = PREVIEW && [d.info.key, d.info.sym, d.info.code].some(function (x) { return String(x || '').toUpperCase() === String(SYM0).toUpperCase(); });
  if (!isCard && PREVIEW) { PREVIEW = null; hideBack(); }
  if (!isCard && (!P.last || P.last.s !== nl.s || P.last.tf !== nl.tf)) { P.last = nl; save_(true); }   // 記住上次看的商品與週期（從 LINE 卡片打開的不算，才不會洗掉原本的畫面）
  var newSym = !D || D.info.sym !== d.info.sym;
  D = d; SYM = d.info.key; TF = d.tf; tvHide('A');
  if (!CAT && !CAT0 && SYM0) setCat(catOf(d.info));
  render(newSym); setTitle();
  if (VIEW0 && innerWidth < 820 && !show.scrolled) { show.scrolled = 1; setTimeout(function () { $('bottom').scrollIntoView({ behavior: 'smooth' }); }, 400); }
  if (MTFKEY !== d.info.sym) {
    MTFKEY = d.info.sym; MTF = null; if (BTAB === 'mtf') renderTab();
    var k = d.info.sym;
    run('webMtf', [d.info.key], function (m) { MTFC[k] = m; if (MTFKEY !== k) return; MTF = m; if (BTAB === 'mtf') renderTab(); prefetch(k, d.info.key); }, true);
  }
}
function catOf(i) {
  if (i.market === 'TW') return 'tw'; if (i.market === 'US') return 'us'; if (i.market === 'CRYPTO') return 'crypto';
  if (/=X$/.test(i.sym)) return 'fx'; if (/=F$/.test(i.sym) && !/^(ES|NQ|YM)=F$/.test(i.sym)) return 'cmd';
  return /^\^(DJI|GSPC|IXIC|NDX|SOX|RUT)$/.test(i.sym) ? 'us' : 'idx';
}
function prefetch(sym, key) {   // 背景先載入其他週期，之後切換幾乎瞬間完成
  var order = ['1d', '1h', '4h', '15m', '1wk', '5m', '30m'].filter(function (t) { return !DC[(key + '|' + t).toUpperCase()]; });
  (function next() {
    var t = order.shift(); if (!t || MTFKEY !== sym) return;
    run('webData', [TOKEN, key, t], function (d) { if (!d.error) DC[(key + '|' + t).toUpperCase()] = { d: d, at: Date.now() }; next(); }, true);
  })();
}

/* ---------- 畫面 ---------- */
function render(newSym) {
  var d = D, q = d.q;
  $('nm').textContent = d.info.name; $('cd').textContent = (d.info.cn ? d.info.cn + '・' : '') + (d.info.code || d.info.sym) + '・' + d.tfLabel;
  $('px').textContent = fmt(q.price); $('px').className = cls(q.chg);
  $('pc').innerHTML = '<span class="' + cls(q.chg) + '">' + (q.chg > 0 ? '+' : '') + fmt(q.chg) + '（' + pct(q.pct) + '）' + (q.h24 ? '24h' : '') + '</span>';
  $('tfs').innerHTML = TFS.map(function (t) { return '<button class="' + (t[0] === TF ? 'on' : '') + '" data-tf="' + t[0] + '">' + t[1] + '</button>'; }).join('');
  each('#tfs button', function (b) { b.onclick = function () { USERTF = true; load(null, b.getAttribute('data-tf')); }; });
  $('logBtn').className = P.log ? 'on' : '';
  drawChart(newSym); renderTab(); renderDetail(); markCur(); renderStar();
}

function heikin(s) {
  var o = [], h = [], l = [], c = [];
  for (var i = 0; i < s.c.length; i++) {
    var hc = (s.o[i] + s.h[i] + s.l[i] + s.c[i]) / 4, ho = i ? (o[i - 1] + c[i - 1]) / 2 : (s.o[i] + s.c[i]) / 2;
    o.push(ho); c.push(hc); h.push(Math.max(s.h[i], ho, hc)); l.push(Math.min(s.l[i], ho, hc));
  }
  return { o: o, h: h, l: l, c: c };
}

/* ---------- 指標計算（可自訂參數；預設參數直接用伺服器算好的值）---------- */
var DEFPRM = { ma: [5, 20, 60, 120, 240], bb: [20, 2], macd: [12, 26, 9], rsi: 14, kd: [9, 3, 3] };
function prm() { var p = P.prm || {}; return { ma: (p.ma || DEFPRM.ma).map(function (x, i) { return +x || DEFPRM.ma[i]; }), bb: p.bb || DEFPRM.bb, macd: p.macd || DEFPRM.macd, rsi: +p.rsi || 14, kd: p.kd || DEFPRM.kd }; }
function iSma(a, n) { var o = [], s = 0, c = 0; for (var i = 0; i < a.length; i++) { s += a[i]; if (i >= n) s -= a[i - n]; o.push(i >= n - 1 ? s / n : null); } return o; }
function iEma(a, n) { var o = [], k = 2 / (n + 1), e = null; for (var i = 0; i < a.length; i++) { if (a[i] == null) { o.push(e); continue; } if (e == null) { if (i >= n - 1) { var s = 0; for (var j = i - n + 1; j <= i; j++) s += a[j]; e = s / n; } } else e = a[i] * k + e * (1 - k); o.push(e); } return o; }
function iRsi(c, n) { var o = [null], g = 0, l = 0; for (var i = 1; i < c.length; i++) { var d = c[i] - c[i - 1], u = Math.max(d, 0), w = Math.max(-d, 0); if (i <= n) { g += u; l += w; o.push(i === n ? (l ? 100 - 100 / (1 + g / l) : 100) : null); if (i === n) { g /= n; l /= n; } } else { g = (g * (n - 1) + u) / n; l = (l * (n - 1) + w) / n; o.push(l ? 100 - 100 / (1 + g / l) : 100); } } return o; }
function iBB(c, n, k) { var m = iSma(c, n), u = [], d = []; for (var i = 0; i < c.length; i++) { if (m[i] == null) { u.push(null); d.push(null); continue; } var s = 0; for (var j = i - n + 1; j <= i; j++) s += Math.pow(c[j] - m[i], 2); var sd = Math.sqrt(s / n); u.push(m[i] + k * sd); d.push(m[i] - k * sd); } return [u, d]; }
function iKD(h, l, c, n, a, b) { var K = [], D = [], k = 50, d = 50; for (var i = 0; i < c.length; i++) { if (i < n - 1) { K.push(null); D.push(null); continue; } var hi = -Infinity, lo = Infinity; for (var j = i - n + 1; j <= i; j++) { hi = Math.max(hi, h[j]); lo = Math.min(lo, l[j]); } var rsv = hi > lo ? (c[i] - lo) / (hi - lo) * 100 : 50; k = (k * (a - 1) + rsv) / a; d = (d * (b - 1) + k) / b; K.push(k); D.push(d); } return [K, D]; }
/* 依目前參數產生要畫的序列（存在 s.c_xxx，跳新 K 棒時會一起補位） */
function calc(d, live) {   // live＝即時更新：全部用最新價格重算（不用伺服器算好的舊值）
  var s = d.ser, p = prm(), sig = JSON.stringify(p) + '|' + s.t.length + '|' + d.tf, srv = !live && !s._live;
  if (live) { s._live = 1; s._sig = ''; } else { if (s._sig === sig) return; s._sig = sig; }

        return '<tr class="etfr" data-k="' + (x.code || '') + '" style="cursor:' + (x.code ? 'pointer' : 'default') + '"><td style="width:28px" class="note">' + (i + 1) + '</td><td><b>' + x.name + '</b> <span class="note">' + (x.code || '') + '</span></td><td style="width:45%">' + (x.w != null ? '<div style="display:flex;align-items:center;gap:6px"><div style="height:8px;border-radius:4px;background:var(--ac);width:' + (x.w / mx * 100).toFixed(0) + '%"></div><span>' + x.w.toFixed(2) + '%</span></div>' : '') + '</td></tr>';
      }).join('') + '</table><div class="note" style="margin-top:6px">資料來源：' + e.src + '。點公司名稱可以直接看它的 K 線。</div>';
    } else h += '<div class="note" style="margin-top:8px">暫時抓不到這檔 ETF 的成分股。</div>';
  }
  $('bp').innerHTML = h;
  each('#bp .etfr', function (r) { r.onclick = function () { var c = r.getAttribute('data-k'); if (c) pick(c); }; });
}
/* ---------- 事件綁定 ---------- */
$('go').onclick = function () { var v = $('q').value.trim(); if (v) { pick(v); $('q').value = ''; $('q').blur(); SG = []; sugRender(); } };
$('ctype').onchange = function () { P.ctype = $('ctype').value; save_(true); redrawAll(); };
$('indBtn').onclick = function () { renderInd(); openPop('indPop', $('indBtn')); };
$('setBtn').onclick = function () { renderSet(); openPop('setPop'); };
$('logBtn').onclick = function () { P.log = P.log ? 0 : 1; save_(true); $('logBtn').className = P.log ? 'on' : ''; if (chart) chart.priceScale('right').applyOptions({ mode: P.log ? 1 : 0 }); panes().slice(1).forEach(function (x) { if (x.chart) x.chart.priceScale('right').applyOptions({ mode: P.log ? 1 : 0 }); }); };
$('fitBtn').onclick = function () { if (chart) chart.timeScale().fitContent(); };
$('drawBtn').onclick = function () { if (DW.tool || DW.mk) { dwCancel(); toast('已取消畫線'); return; } renderDrawPop(); openPop('drawPop', $('drawBtn')); };
$('mask').onclick = closePops;
$('star').onclick = function () { if (D) toggleWatch(D); };
setInterval(tick, 5000);   // 股票每 5 秒更新最新價；加密貨幣用即時串流
setInterval(function () { countdown(); }, 1000);
window.addEventListener('resize', function () { setTimeout(function () { placeLegends(); }, 100); });
setInterval(function () {   // 每分鐘自動更新目前商品與清單
  if (document.hidden || !D) return;
  load(SYM, TF, { force: true, silent: true });
  if (CAT) { if (MK[CAT]) MK[CAT].at = 0; setCat(CAT); }
}, 60000);

/* ---------- 啟動 ---------- */
applyTheme(); $('ctype').value = P.ctype; if (P.bmin && innerWidth >= 820 && !VIEW0) $('bottom').classList.add('min');
if (VIEW0 && BT.some(function (b) { return b[0] === VIEW0; })) BTAB = VIEW0; else if (P.btab && BT.some(function (b) { return b[0] === P.btab; })) BTAB = P.btab;
if (P.draws && !Object.keys(DRAWS).length) DRAWS = P.draws;   // 從卡片的「大趨勢／新聞／AI 解讀」按鈕開啟 → 直接到該分頁
renderTabs();
var SYM0 = SYM, PREVIEW = SYM0 || null, PREV = SYM0 ? { last: P.last, cat: P.cat, grid: P.gridOn } : null;
function hideBack() { var b = $('backChip'); if (b) b.remove(); }
function showBack() {   // 從 LINE 卡片打開時，提供「回到上次的畫面」
  hideBack(); if (!PREV || !PREV.last || !PREV.last.s) return;
  if (String(PREV.last.s).toUpperCase() === String(SYM0).toUpperCase() && !PREV.grid) return;
  var tfn = (TFS.filter(function (x) { return x[0] === PREV.last.tf; })[0] || [0, PREV.last.tf])[1];
  var b = document.createElement('div'); b.id = 'backChip';
  b.innerHTML = '<button id="bkGo">↩ 回到上次的畫面（' + String(PREV.last.s).replace(/^\^/, '') + '・' + tfn + (PREV.grid ? '・多張圖表' : '') + '）</button><button id="bkX" title="關閉">✕</button>';
  document.body.appendChild(b);
  $('bkGo').onclick = function () {
    var p = PREV; PREVIEW = null; hideBack();
    try { history.replaceState(null, '', location.href.replace(/([?&])(s|tf|c|v)=[^&]*/g, '$1').replace(/[?&]+$/, '').replace(/\?&+/, '?')); } catch (e) {}
    if (p.cat) setCat(p.cat); load(p.last.s, p.last.tf); if (p.grid) setTimeout(gOpen, 300);
  };
  $('bkX').onclick = hideBack;
}
if (!SYM && P.last && P.last.s) { SYM = P.last.s; if (!TFP) TF = P.last.tf || TF; }   // 沒指定商品 → 打開上次看的商品與週期
else if (!TFP && P.dtf) TF = P.dtf;   // 指定商品但沒指定週期 → 用你設定的預設週期
var startCat = CAT0 || (SYM0 ? '' : P.cat || 'watch');
run('webWatch', [TOKEN], function (w) {
  W = w; MK.watch = { rows: w.list, at: Date.now() };
  if (w.pref) {
    var oldTf = TF, lp = P; if (SYM0 && w.pref.last) PREV = { last: w.pref.last, cat: w.pref.cat, grid: w.pref.gridOn }; P = merge_(w.pref); if (PREVIEW) { if (PREV) { P.last = PREV.last; P.cat = PREV.cat; } showBack(); }
    if (w.pref.draws) { DRAWS = w.pref.draws; try { localStorage.setItem('iaDraw', JSON.stringify(DRAWS)); } catch (e) {} }   // 畫線跟著帳號，換裝置也看得到
    if (!SYM0 && P.last && P.last.s && !USERTF && (String(P.last.s).toUpperCase() !== String(SYM).toUpperCase() || P.last.tf !== TF)) load(P.last.s, P.last.tf);
    else if (SYM0 && !TFP && P.dtf && P.dtf !== oldTf && !USERTF) load(null, P.dtf);
    if (P.split > 1 && SPLITN === 1) setTimeout(function () { toggleSplit(Math.min(+P.split, innerWidth < 820 ? 2 : 4)); setAct('A'); }, 300);
    if (!CAT0 && !SYM0 && P.cat && P.cat !== CAT) setCat(P.cat); try { localStorage.setItem('iaPref', JSON.stringify(P)); } catch (e) {} applyTheme(); $('ctype').value = P.ctype; if (D) { drawChart(false); renderDetail(); } }
  if (CAT === 'watch') renderList(MK.watch); renderStar();
}, true);
SPLIT_BIND(); gBind();
if (startCat) setCat(startCat);
if (P.gridOn && !SYM0) setTimeout(gOpen, 600);
if (PREV) setTimeout(function () { if (PREVIEW && !$('backChip')) showBack(); }, 1500);   // 上次停在多張圖表 → 直接打開
if (P.split > 1) setTimeout(function () { toggleSplit(Math.min(+P.split, innerWidth < 820 ? 2 : 4)); setAct('A'); }, 800);
load(SYM || ({ us: '^GSPC', tw: '^TWII', crypto: 'BTC', fx: 'TWD=X', idx: 'DXY', cmd: 'GC=F' }[String(CAT0).split('-')[0]] || '2330'), TF);
window.addEventListener('resize', function () { if (D && chart) { /* autoSize 會自動調整 */ } });
</script>
</body>
