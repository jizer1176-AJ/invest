<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<script src="https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root, [data-theme="tv"] { --bg:#131722; --pn:#1e222d; --pn2:#2a2e39; --ln:#2a2e39; --tx:#d1d4dc; --sb:#787b86; --ac:#2962ff; --hv:#2a2e39; --grid:rgba(255,255,255,.05); }
  [data-theme="navy"]  { --bg:#0b1220; --pn:#111a2e; --pn2:#1a2540; --ln:#1f2a44; --tx:#dbe4f3; --sb:#7f8ba3; --ac:#3b82f6; --hv:#1a2540; --grid:rgba(255,255,255,.05); }
  [data-theme="black"] { --bg:#000000; --pn:#0e0e0e; --pn2:#1c1c1c; --ln:#222222; --tx:#eaeaea; --sb:#8a8a8a; --ac:#f0b90b; --hv:#1c1c1c; --grid:rgba(255,255,255,.05); }
  [data-theme="light"] { --bg:#ffffff; --pn:#f8f9fd; --pn2:#eef0f6; --ln:#e0e3eb; --tx:#131722; --sb:#6a6d78; --ac:#2962ff; --hv:#eef0f6; --grid:rgba(0,0,0,.06); }
  [data-theme="paper"] { --bg:#f6f1e7; --pn:#efe8da; --pn2:#e6dcc9; --ln:#d9ceb9; --tx:#3a3226; --sb:#7d715f; --ac:#b5651d; --hv:#e6dcc9; --grid:rgba(0,0,0,.06); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--tx); font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; font-size:var(--fs,13px); }
  button, select, input { font:inherit; color:var(--tx); }
  button { background:transparent; border:1px solid transparent; border-radius:6px; padding:5px 9px; cursor:pointer; white-space:nowrap; }
  button:hover { background:var(--hv); }
  button.on { background:var(--ac); color:#fff; }
  select { background:var(--pn); border:1px solid var(--ln); border-radius:6px; padding:4px 6px; }
  .up { color:var(--upc); } .dn { color:var(--dnc); } .fl { color:var(--sb); }

  /* 工具列 */
  #tb { display:flex; align-items:center; gap:6px; padding:6px 10px; border-bottom:1px solid var(--ln); background:var(--bg); position:sticky; top:0; z-index:20; flex-wrap:wrap; }
  #symbox { display:flex; align-items:baseline; gap:8px; min-width:0; }
  #nm { font-weight:700; font-size:1.15em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:200px; }
  #cd { color:var(--sb); font-size:.85em; white-space:nowrap; }
  #px { font-weight:800; font-size:1.25em; }
  #pc { font-weight:700; font-size:.92em; white-space:nowrap; }
  .search { display:flex; align-items:center; background:var(--pn); border:1px solid var(--ln); border-radius:6px; padding:0 4px 0 8px; }
  .search input { background:transparent; border:0; outline:0; width:170px; padding:6px 0; }
  .sep { width:1px; height:22px; background:var(--ln); margin:0 2px; }
  .seg { display:flex; gap:2px; }
  .seg button { padding:5px 8px; }
  .grow { flex:1; }
  #star.on { color:#f7c948; background:transparent; }

  /* 主體 */
  #main { display:grid; grid-template-columns:1fr 340px; height:calc(100vh - 47px); min-height:560px; }
  #left { display:flex; flex-direction:column; min-width:0; border-right:1px solid var(--ln); }
  #chartWrap { position:relative; flex:1; min-height:300px; }
  #chart { position:absolute; inset:0; }
  #lg { position:absolute; left:10px; top:6px; right:80px; z-index:3; font-size:.85em; color:var(--sb); pointer-events:none; line-height:1.55; }
  #lg b { color:var(--tx); }
  #spin { position:absolute; right:84px; top:8px; z-index:4; font-size:.85em; color:var(--sb); background:var(--pn); border:1px solid var(--ln); border-radius:12px; padding:2px 10px; display:none; }
  #bottom { height:230px; border-top:1px solid var(--ln); display:flex; flex-direction:column; }
  .tabs { display:flex; gap:2px; flex-wrap:nowrap; padding:4px 6px; border-bottom:1px solid var(--ln); overflow-x:auto; scrollbar-width:none; flex:0 0 auto; }
  .tabs::-webkit-scrollbar { display:none; }
  .tabs button { color:var(--sb); padding:6px 10px; border-radius:6px; }
  #bottom.min { height:auto; } #bottom.min #bp { display:none; }
  .tabs button.on { color:var(--tx); background:var(--pn2); font-weight:700; }
  #bp { flex:1; overflow:auto; padding:10px 14px; }
  #cats { flex-wrap:wrap; }
  #side { display:flex; flex-direction:column; min-height:0; background:var(--bg); }
  #mhead { padding:6px 10px; font-size:.85em; color:var(--sb); border-bottom:1px solid var(--ln); }
  #mlist { flex:1; overflow:auto; min-height:120px; }
  .mrow { display:grid; grid-template-columns:1fr auto 72px; gap:6px; padding:7px 10px; cursor:pointer; align-items:center; border-bottom:1px solid var(--ln); }
  .mrow:hover { background:var(--hv); }
  .mrow.cur { background:var(--pn2); box-shadow:inset 3px 0 0 var(--ac); }
  .mrow .n { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mrow .s { color:var(--sb); font-size:.8em; }
  .mrow .p { text-align:right; font-variant-numeric:tabular-nums; }
  .mrow .c { text-align:right; font-weight:700; font-variant-numeric:tabular-nums; }
  .mrow .x { color:var(--sb); font-size:.78em; text-align:right; }
  .mh { display:grid; grid-template-columns:1fr auto 72px; gap:6px; padding:4px 10px; color:var(--sb); font-size:.78em; border-bottom:1px solid var(--ln); }
  #detail { border-top:1px solid var(--ln); padding:10px 12px; max-height:46%; overflow:auto; }
  .kv { display:grid; grid-template-columns:1fr 1fr; gap:2px 14px; }
  .kv div { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px dashed var(--ln); font-size:.92em; }
  .kv span:first-child { color:var(--sb); }
  h4 { margin:2px 0 8px; font-size:1em; }
  .big { font-size:1.3em; font-weight:800; }
  .note { color:var(--sb); font-size:.85em; line-height:1.55; }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:6px 4px; border-bottom:1px solid var(--ln); text-align:center; }
  th { color:var(--sb); font-weight:600; font-size:.88em; }
  td:first-child, th:first-child { text-align:left; }
  .plan { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .plan > div { border-radius:8px; padding:10px; border:1px solid var(--ln); background:var(--pn); }
  .plan p { margin:4px 0; display:flex; justify-content:space-between; }
  .calc { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:10px; }
  .calc input, .calc select { width:100px; background:var(--pn); border:1px solid var(--ln); border-radius:6px; padding:4px 6px; }
  .ev { display:flex; gap:10px; padding:7px 0; border-bottom:1px solid var(--ln); }
  .ev .d { width:52px; font-weight:700; } .ev .bar { width:3px; border-radius:2px; }
  .tag { display:inline-block; padding:1px 7px; border-radius:10px; font-size:.78em; font-weight:700; }
  .rng { position:relative; height:6px; border-radius:3px; background:linear-gradient(90deg,var(--dnc),var(--sb),var(--upc)); margin:8px 0 4px; opacity:.85; }
  .rng i { position:absolute; top:-4px; width:3px; height:14px; background:var(--tx); border-radius:2px; }
  .domb { display:flex; height:10px; border-radius:5px; overflow:hidden; margin:6px 0 4px; }
  .lgd { display:flex; flex-wrap:wrap; gap:4px 10px; font-size:.78em; }
  .lgd i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:3px; }

  .plg { position:absolute; left:10px; z-index:3; font-size:.82em; color:var(--sb); pointer-events:none; white-space:nowrap; }
  .ik { pointer-events:auto; cursor:help; border-bottom:1px dotted currentColor; }
  .ik:hover { filter:brightness(1.3); }
  #lg .ik { margin-right:2px; }
  #cdn { position:absolute; right:0; z-index:4; color:#fff; font-size:11px; text-align:center; padding:1px 0; display:none; pointer-events:none; font-variant-numeric:tabular-nums; }
  #tip { position:fixed; z-index:70; width:min(320px,90vw); background:var(--pn); border:1px solid var(--ln); border-radius:10px; padding:10px 12px; box-shadow:0 8px 30px rgba(0,0,0,.35); display:none; font-size:.92em; }
  .fup { animation:fu .6s; } .fdn { animation:fd .6s; }
  @keyframes fu { 0% { background:rgba(242,54,69,.35); } 100% { background:transparent; } }
  @keyframes fd { 0% { background:rgba(8,153,129,.35); } 100% { background:transparent; } }
  /* 浮動視窗 */
  .pop { position:fixed; z-index:50; background:var(--pn); border:1px solid var(--ln); border-radius:10px; box-shadow:0 8px 30px rgba(0,0,0,.35); padding:12px; display:none; }
  #indPop { width:250px; }
  #indPop label { display:flex; align-items:center; gap:8px; padding:5px 2px; cursor:pointer; }
  #indPop i { width:14px; height:3px; border-radius:2px; display:inline-block; }
  #setPop { left:50%; top:50%; transform:translate(-50%,-50%); width:min(420px,92vw); max-height:88vh; overflow:auto; }
  #setPop h5 { margin:12px 0 6px; color:var(--sb); font-weight:600; }
  .opts { display:flex; flex-wrap:wrap; gap:6px; }
  .opts button { border:1px solid var(--ln); }
  .sw { display:inline-block; width:16px; height:16px; border-radius:4px; vertical-align:-3px; margin-right:6px; border:1px solid rgba(128,128,128,.4); }
  #mask { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:40; display:none; }
  #msg { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); z-index:60; background:#ff9800; color:#111; padding:8px 14px; border-radius:8px; font-weight:600; display:none; max-width:90vw; }

  /* 手機 */
  @media (max-width: 820px) {
    #tb { gap:4px; padding:6px 8px; position:relative; }
    #lg { font-size:.72em; right:56px; }
    #lg br + span ~ span { }
    #symbox { flex:1 1 100%; order:0; }
    #pcwrap { margin-left:auto; text-align:right; }
    .search { order:1; flex:1; } .search input { width:100%; }
    #star, #setBtn { order:1; }
    #tfs { order:2; flex:1 1 100%; overflow-x:auto; } #tfs button { flex:1; }
    #tools { order:3; flex:1 1 100%; display:flex; gap:4px; }
    .sep, .grow { display:none; }
    #main { display:block; height:auto; }
    #left { border-right:0; }
    #chartWrap { height:64vh; flex:none; }
    #bottom { height:auto; }
    #bp { max-height:none; overflow:visible; }
    #side { border-top:1px solid var(--ln); }
    #mlist { max-height:48vh; }
    #detail { max-height:none; }
    .plan { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div id="tb">
  <div id="symbox"><span id="nm">載入中…</span><span id="cd"></span><span id="pcwrap"><span id="px"></span> <span id="pc"></span></span></div>
  <div class="search"><input id="q" placeholder="搜尋：2330、NVDA、BTC、PEPE、JPY=X、GC=F" enterkeyhint="search"><button id="go">🔍</button></div>
  <button id="star" title="加入／移除追蹤">☆</button>
  <span class="sep"></span>
  <div class="seg" id="tfs"></div>
  <span class="sep"></span>
  <div id="tools" class="seg">
    <select id="ctype" title="圖表類型">
      <option value="candle">K 線</option><option value="hollow">空心 K 線</option><option value="bar">美國線</option>
      <option value="ha">平均 K（HA）</option><option value="line">折線</option><option value="area">面積</option>
    </select>
    <button id="indBtn">📊 指標</button>
    <button id="logBtn" title="對數座標">Log</button>
    <button id="fitBtn" title="顯示全部">⤢</button>
  </div>
  <span class="grow"></span>
  <button id="setBtn" title="外觀設定">⚙️ 外觀</button>
</div>

<div id="main">
  <div id="left">
    <div id="chartWrap"><div id="lg"></div><div id="plgs"></div><div id="cdn"></div><div id="spin">⏳ 更新中</div><div id="chart"></div></div>
    <div id="bottom"><div class="tabs" id="btabs"></div><div id="bp"></div></div>
  </div>
  <aside id="side">
    <div class="tabs" id="cats"></div>
    <div id="mhead"></div>
    <div class="mh"><span>商品</span><span style="text-align:right">最新價</span><span style="text-align:right">漲跌</span></div>
    <div id="mlist"></div>
    <div id="detail"></div>
  </aside>
</div>

<div id="mask"></div>
<div id="indPop" class="pop"></div>
<div id="setPop" class="pop"></div>
<div id="msg"></div>
<div id="tip"></div>

<script>
var QS = {}; try { location.search.replace(/^\?/, '').split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) QS[p[0]] = decodeURIComponent((p[1] || '').replace(/\+/g, ' ')); }); } catch (e) {}
function tv(x, k) { return x.charAt(0) === '\x3C' ? (QS[k] || '') : x; }   // 放在外部網站時，改從網址讀參數
var TOKEN = tv('<?= token ?>', 't'), SYM = tv('<?= sym ?>', 's').replace(/^~/, '^'), TFP = tv('<?= tf ?>', 'tf'), CAT0 = tv('<?= cat ?>', 'c'), VIEW0 = tv('<?= view ?>', 'v'), TF = TFP || '1d';
var GAS = !!(window.google && google.script && google.script.run), API = QS.api || '';
var TFS = [['5m','5分'],['15m','15分'],['30m','30分'],['1h','1時'],['4h','4時'],['1d','日'],['1wk','週']];
var CATS = [['watch','⭐ 自選'],['us','美股'],['tw','台股'],['crypto','加密貨幣'],['fx','法定貨幣'],['idx','重要指數'],['cmd','原物料']];
var BT = [['sum','綜合判讀'],['mtf','多週期共振'],['macro','大趨勢'],['news','新聞'],['ai','AI 解讀'],['vol','波動數據'],['plan','交易計畫'],['lv','支撐壓力'],['desc','指標介紹'],['evs','重要事件']];
var IND = [['ma5','MA5','#f7c948'],['ma20','MA20','#ff7043'],['ma60','MA60','#ab47bc'],['ma120','MA120','#26c6da'],['ma240','MA240','#4db6ac'],['bb','布林通道','#5b8def'],
  ['vol','成交量'],['macd','MACD'],['rsi','RSI'],['kd','KD'],['lv','支撐壓力線'],['plan','停損線'],['mk','金叉／死叉標記']];
var THEMES = [['tv','經典深色','#131722'],['navy','深海藍','#0b1220'],['black','純黑','#000000'],['light','明亮','#ffffff'],['paper','護眼米色','#f6f1e7']];
var DEF = { theme:'tv', color:'tw', ctype:'candle', fs:13, grid:1, log:0, ind:{ ma5:1, ma20:1, ma60:1, ma120:0, ma240:1, bb:1, vol:1, macd:1, rsi:1, kd:0, lv:1, plan:0, mk:1 } };
var USERTF = false, P = load_(), D = null, W = null, MTF = null, MTFKEY = '', CAT = '', MK = {}, DC = {}, EVS = null, chart = null, BTAB = 'sum', SEQ = 0;
var $ = function (id) { return document.getElementById(id); };

/* ---------- 偏好設定 ---------- */
function load_() { var p = null; try { p = JSON.parse(localStorage.getItem('iaPref') || 'null'); } catch (e) {} return merge_(p); }
function merge_(p) { var o = JSON.parse(JSON.stringify(DEF)); if (p) { for (var k in p) if (k !== 'ind') o[k] = p[k]; if (p.ind) for (var j in p.ind) o.ind[j] = p.ind[j]; } return o; }
function save_(remote) {
  try { localStorage.setItem('iaPref', JSON.stringify(P)); } catch (e) {}
  if (remote && W && W.login) google.script.run.withFailureHandler(function () {}).webPref(TOKEN, P);
}
function applyTheme() {
  document.documentElement.setAttribute('data-theme', P.theme);
  var tw = P.color === 'tw', up = tw ? '#f23645' : '#089981', dn = tw ? '#089981' : '#f23645';
  document.documentElement.style.setProperty('--upc', up); document.documentElement.style.setProperty('--dnc', dn);
  document.documentElement.style.setProperty('--fs', P.fs + 'px');
}
function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

/* ---------- 共用 ---------- */
function fmt(x, dp) { if (x == null || isNaN(x)) return '—'; if (dp == null) dp = D ? D.info.dp : 2; return Number(x).toLocaleString('en-US', { minimumFractionDigits: dp, maximumFractionDigits: dp }); }
function big(x) { if (!x) return '—'; var a = Math.abs(x); return a >= 1e12 ? (x / 1e12).toFixed(2) + ' 兆' : a >= 1e8 ? (x / 1e8).toFixed(1) + ' 億' : a >= 1e4 ? (x / 1e4).toFixed(1) + ' 萬' : fmt(x, 0); }
function pct(x) { return x == null || isNaN(x) ? '—' : (x > 0 ? '+' : '') + x.toFixed(2) + '%'; }
function cls(x) { return x > 0 ? 'up' : x < 0 ? 'dn' : 'fl'; }
function tcol(s) { return /多|強/.test(s || '') ? 'var(--upc)' : /空|弱/.test(s || '') ? 'var(--dnc)' : 'var(--sb)'; }
function oc(c) { return /^#(555|666|777|888|999)/i.test(c || '') ? 'var(--sb)' : c; }
function toast(t) { var m = $('msg'); m.textContent = t; m.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { m.style.display = 'none'; }, 3500); }
function run(fn, args, ok, quiet) {
  var fail = function (e) { $('spin').style.display = 'none'; if (!quiet) toast('⚠️ ' + (e && e.message || e)); };
  if (GAS) { var r = google.script.run.withSuccessHandler(ok).withFailureHandler(fail); r[fn].apply(r, args); return; }
  if (!API) { fail('缺少 api 參數，請從 LINE 的按鈕開啟'); return; }
  fetch(API + '?p=api&fn=' + fn + '&a=' + encodeURIComponent(JSON.stringify(args))).then(function (x) { return x.json(); })
    .then(function (j) { if (j && j.__error) fail(j.__error); else ok(j); })['catch'](fail);
}
function each(sel, f) { Array.prototype.forEach.call(document.querySelectorAll(sel), f); }

/* ---------- 載入資料（含快取與預先載入）---------- */
function load(sym, tf, opt) {
  opt = opt || {};
  if (sym) SYM = sym; if (tf) TF = tf;
  var key = (SYM + '|' + TF).toUpperCase(), c = DC[key], my = ++SEQ;
  if (c && !opt.force) { show(c.d); if (Date.now() - c.at < 60000) return; }
  else if (!opt.silent) $('spin').style.display = 'block';
  run('webData', [TOKEN, SYM, TF], function (d) {
    if (my !== SEQ && !opt.silent) return;
    $('spin').style.display = 'none';
    if (d.error) { if (!opt.silent) toast('⚠️ ' + d.error); if (!D) $('nm').textContent = '查無資料'; if (!CAT) setCat('watch'); return; }
    DC[(SYM + '|' + d.tf).toUpperCase()] = DC[(d.info.key + '|' + d.tf).toUpperCase()] = { d: d, at: Date.now() };
    if (my === SEQ) show(d);
  }, opt.silent);
}
function show(d) {
  var newSym = !D || D.info.sym !== d.info.sym;
  D = d; SYM = d.info.key; TF = d.tf;
  if (!CAT && !CAT0 && SYM0) setCat(catOf(d.info));
  render(newSym);
  if (VIEW0 && innerWidth < 820 && !show.scrolled) { show.scrolled = 1; setTimeout(function () { $('bottom').scrollIntoView({ behavior: 'smooth' }); }, 400); }
  if (MTFKEY !== d.info.sym) {
    MTFKEY = d.info.sym; MTF = null; if (BTAB === 'mtf') renderTab();
    var k = d.info.sym;
    run('webMtf', [d.info.key], function (m) { if (MTFKEY !== k) return; MTF = m; if (BTAB === 'mtf') renderTab(); prefetch(k, d.info.key); }, true);
  }
}
function catOf(i) {
  if (i.market === 'TW') return 'tw'; if (i.market === 'US') return 'us'; if (i.market === 'CRYPTO') return 'crypto';
  if (/=X$/.test(i.sym)) return 'fx'; if (/=F$/.test(i.sym) && !/^(ES|NQ|YM)=F$/.test(i.sym)) return 'cmd';
  return /^\^(DJI|GSPC|IXIC|NDX|SOX|RUT)$/.test(i.sym) ? 'us' : 'idx';
}
function prefetch(sym, key) {   // 背景先載入其他週期，之後切換幾乎瞬間完成
  var order = ['1d', '1h', '4h', '15m', '1wk', '5m', '30m'].filter(function (t) { return !DC[(key + '|' + t).toUpperCase()]; });
  (function next() {
    var t = order.shift(); if (!t || MTFKEY !== sym) return;
    run('webData', [TOKEN, key, t], function (d) { if (!d.error) DC[(key + '|' + t).toUpperCase()] = { d: d, at: Date.now() }; next(); }, true);
  })();
}

/* ---------- 畫面 ---------- */
function render(newSym) {
  var d = D, q = d.q;
  $('nm').textContent = d.info.name; $('cd').textContent = (d.info.code || d.info.sym) + '・' + d.tfLabel;
  $('px').textContent = fmt(q.price); $('px').className = cls(q.chg);
  $('pc').innerHTML = '<span class="' + cls(q.chg) + '">' + (q.chg > 0 ? '+' : '') + fmt(q.chg) + '（' + pct(q.pct) + '）' + (q.h24 ? '24h' : '') + '</span>';
  $('tfs').innerHTML = TFS.map(function (t) { return '<button class="' + (t[0] === TF ? 'on' : '') + '" data-tf="' + t[0] + '">' + t[1] + '</button>'; }).join('');
  each('#tfs button', function (b) { b.onclick = function () { USERTF = true; load(null, b.getAttribute('data-tf')); }; });
  $('logBtn').className = P.log ? 'on' : '';
  drawChart(newSym); renderTab(); renderDetail(); markCur(); renderStar();
}

function renderDetail() {
  var d = D, q = d.q, v = d.vol, dp = d.info.dp;
  var lo = v.lo52, hi = v.hi52, pos = lo != null && hi > lo ? Math.max(0, Math.min(100, (q.price - lo) / (hi - lo) * 100)) : null;
  var mk = { TW: '台股', US: '美股', CRYPTO: '加密貨幣', INDEX: '指數／外匯／商品' }[d.info.market] || '';
  $('detail').innerHTML = '<div style="display:flex;justify-content:space-between;align-items:baseline"><b>' + d.info.name + '</b><span class="note">' + mk + '</span></div>' +
    '<div style="margin:4px 0"><span class="big ' + cls(q.chg) + '">' + fmt(q.price) + '</span> <span class="' + cls(q.chg) + '" style="font-weight:700">' + (q.chg > 0 ? '+' : '') + fmt(q.chg) + '（' + pct(q.pct) + '）</span></div>' +
    '<div class="note">' + (q.h24 ? '24 小時漲跌・' : '') + '更新 ' + d.updated + '</div>' +
    '<div class="kv" style="margin-top:8px">' + (q.open != null && !q.h24 ? '<div><span>開盤</span><span>' + fmt(q.open) + '</span></div>' : '') + '<div><span>' + (q.h24 ? '24h 前' : '前收') + '</span><span>' + fmt(q.prev) + '</span></div>' +
    (q.high != null ? '<div><span>' + (q.h24 ? '24h 最高' : '最高') + '</span><span>' + fmt(q.high) + '</span></div><div><span>' + (q.h24 ? '24h 最低' : '最低') + '</span><span>' + fmt(q.low) + '</span></div>' : '') +
    (q.vol ? '<div><span>成交量</span><span>' + big(q.vol) + '</span></div>' : '') + '<div><span>ATR</span><span>' + fmt(v.atr) + '</span></div></div>' +
    (pos != null ? '<div style="margin-top:8px" class="note">52 週區間</div><div class="rng"><i style="left:calc(' + pos + '% - 1px)"></i></div><div style="display:flex;justify-content:space-between" class="note"><span>' + fmt(lo) + '</span><span>' + pos.toFixed(0) + '%</span><span>' + fmt(hi) + '</span></div>' : '') +
    '<div style="margin-top:8px;padding:8px;border-radius:8px;background:var(--pn)"><b style="color:' + oc(d.ov.color) + '">' + d.ov.label + '</b><div class="note">' + d.a.summary + '</div></div>';
}

/* ---------- 右側：市場清單 ---------- */
function renderCats() {
  $('cats').innerHTML = CATS.map(function (c) { return '<button class="' + (c[0] === CAT ? 'on' : '') + '" data-c="' + c[0] + '">' + c[1] + '</button>'; }).join('');
  each('#cats button', function (b) { b.onclick = function () { setCat(b.getAttribute('data-c')); }; });
}
function setCat(c) {
  CAT = c; renderCats();
  var m = MK[c];
  if (m) renderList(m);
  if (!m || Date.now() - m.at > 50000) {
    if (!m) { $('mlist').innerHTML = '<div class="note" style="padding:12px">⏳ 載入中…</div>'; $('mhead').innerHTML = ''; }
    if (c === 'watch') run('webWatch', [TOKEN], function (w) { W = w; MK.watch = { rows: w.list, at: Date.now() }; if (CAT === 'watch') renderList(MK.watch); renderStar(); }, true);
    else run('webMarkets', [c], function (r) { r.at = Date.now(); MK[c] = r; if (CAT === c) renderList(r); }, true);
  }
}
function renderList(m) {
  var rows = m.rows || [];
  var head = '';
  if (CAT === 'watch') head = W && W.login ? '我的追蹤清單（與 LINE「我的自選」同步）・按 ☆ 加入目前商品' : '⚠️ 請從 LINE 輸入「網頁」開啟個人連結，才能同步追蹤清單';
  else if (CAT === 'crypto' && m.dom) {
    var cols = ['#f7931a', '#627eea', '#26a17b', '#f3ba2f', '#00aae4', '#9945ff', '#2775ca', '#c2a633'], tot = 0;
    var top = rows.filter(function (r) { return r.dom != null; }).slice(0, 8);
    var bar = top.map(function (r, i) { tot += r.dom; return '<span title="' + r.sub + ' ' + r.dom.toFixed(1) + '%" style="width:' + r.dom + '%;background:' + cols[i] + '"></span>'; }).join('') + '<span style="flex:1;background:var(--pn2)"></span>';
    head = '<b style="color:var(--tx)">市佔率</b>　BTC.D <b style="color:#f7931a">' + m.dom.pct.toFixed(2) + '%</b>　ETH.D ' + m.dom.eth.toFixed(2) + '%　總市值 $' + big(m.dom.mcap) + '（' + pct(m.dom.chg) + '）' +
      '<div class="domb">' + bar + '</div><div class="lgd">' + top.map(function (r, i) { return '<span><i style="background:' + cols[i] + '"></i>' + r.sub + ' ' + r.dom.toFixed(1) + '%</span>'; }).join('') + '<span><i style="background:var(--pn2)"></i>其他 ' + Math.max(0, 100 - tot).toFixed(1) + '%</span></div>';
  } else head = (m.title || '') + (m.updated ? '・更新 ' + m.updated : '') + (CAT === 'crypto' ? '・24h 漲跌' : '');
  $('mhead').innerHTML = head;
  $('mlist').innerHTML = rows.map(function (r) {
    var x = r.dom != null ? '市佔 ' + r.dom.toFixed(2) + '%' + (r.mcap ? '・$' + big(r.mcap) : '') : '';
    return '<div class="mrow" data-k="' + r.key + '" data-s="' + r.sym + '"><div style="min-width:0"><div class="n">' + r.name + (r.stable ? ' <span class="tag" style="background:var(--pn2);color:var(--sb)">穩定幣</span>' : '') + '</div><div class="s">' + r.sub + '</div></div>' +
      '<div><div class="p">' + fmt(r.price, r.dp) + '</div>' + (x ? '<div class="x">' + x + '</div>' : '') + '</div><div class="c ' + cls(r.pct) + '">' + pct(r.pct) + '</div></div>';
  }).join('') || '<div class="note" style="padding:12px">清單是空的</div>';
  each('#mlist .mrow', function (el) { el.onclick = function () { load(el.getAttribute('data-k')); if (innerWidth < 820) scrollTo({ top: 0, behavior: 'smooth' }); }; });
  markCur();
}
function markCur() { if (!D) return; each('#mlist .mrow', function (el) { el.classList.toggle('cur', el.getAttribute('data-s') === D.info.sym); }); }
function renderStar() {
  if (!D || !W) return;
  var inList = W.list.some(function (x) { return x.sym === D.info.sym; });
  $('star').textContent = inList ? '★' : '☆'; $('star').className = inList ? 'on' : '';
}

/* ---------- 指標選單、外觀設定 ---------- */
function openPop(id, btn) {
  closePops(); var p = $(id); p.style.display = 'block'; $('mask').style.display = 'block';
  if (btn) { var r = btn.getBoundingClientRect(); p.style.left = Math.min(r.left, innerWidth - p.offsetWidth - 8) + 'px'; p.style.top = (r.bottom + 6) + 'px'; }
}
function closePops() { each('.pop', function (p) { p.style.display = 'none'; }); $('mask').style.display = 'none'; }
function renderInd() {
  $('indPop').innerHTML = '<h4>📊 指標</h4>' + IND.map(function (t) { return '<label><input type="checkbox" data-i="' + t[0] + '"' + (P.ind[t[0]] ? ' checked' : '') + '>' + (t[2] ? '<i style="background:' + t[2] + '"></i>' : '') + t[1] + (INFO[t[0]] ? ' <span class="ik" data-k="' + t[0] + '" style="margin-left:auto;border:0">ⓘ</span>' : '') + '</label>'; }).join('');
  each('#indPop input', function (c) { c.onchange = function () { P.ind[c.getAttribute('data-i')] = c.checked ? 1 : 0; save_(true); if (D) drawChart(false); }; });
}
function renderSet() {
  var opt = function (k, list) { return '<div class="opts">' + list.map(function (o) { return '<button class="' + (String(P[k]) === String(o[0]) ? 'on' : '') + '" data-k="' + k + '" data-v="' + o[0] + '">' + (o[2] ? '<span class="sw" style="background:' + o[2] + '"></span>' : '') + o[1] + '</button>'; }).join('') + '</div>'; };
  $('setPop').innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center"><h4 style="margin:0">⚙️ 外觀設定</h4><button id="closeSet">✕</button></div>' +
    '<h5>佈景主題</h5>' + opt('theme', THEMES) +
    '<h5>漲跌顏色</h5>' + opt('color', [['tw', '台灣：紅漲綠跌'], ['intl', '國際：綠漲紅跌']]) +
    '<h5>圖表類型</h5>' + opt('ctype', [['candle', 'K 線'], ['hollow', '空心 K'], ['bar', '美國線'], ['ha', '平均 K'], ['line', '折線'], ['area', '面積']]) +
    '<h5>字體大小</h5>' + opt('fs', [[12, '小'], [13, '中'], [15, '大'], [17, '特大']]) +
    '<h5>格線</h5>' + opt('grid', [[1, '顯示'], [0, '隱藏']]) +
    '<h5>開啟時的預設週期</h5>' + opt('dtf', TFS) +
    '<div class="note" style="margin-top:12px">' + (W && W.login ? '✅ 設定會存到你的帳號，換手機或電腦也會套用。' : '設定只存在這個瀏覽器；從 LINE 個人連結開啟可同步到帳號。') + '</div>' +
    '<div style="margin-top:10px"><button id="resetSet" style="border:1px solid var(--ln)">恢復預設</button></div>';
  each('#setPop .opts button', function (b) {
    b.onclick = function () {
      var k = b.getAttribute('data-k'), v = b.getAttribute('data-v'); P[k] = /^(fs|grid)$/.test(k) ? +v : v;
      save_(true); applyTheme(); renderSet(); $('ctype').value = P.ctype; if (D) { drawChart(false); renderDetail(); renderTab(); }
      if (MK[CAT]) renderList(MK[CAT]);
    };
  });
  $('closeSet').onclick = closePops;
  $('resetSet').onclick = function () { P = merge_(null); save_(true); applyTheme(); renderSet(); renderInd(); $('ctype').value = P.ctype; if (D) drawChart(false); };
}

/* ---------- 事件綁定 ---------- */
$('go').onclick = function () { var v = $('q').value.trim(); if (v) { load(v); $('q').value = ''; $('q').blur(); } };
$('q').onkeydown = function (e) { if (e.key === 'Enter') $('go').onclick(); };
$('ctype').onchange = function () { P.ctype = $('ctype').value; save_(true); if (D) drawChart(false); };
$('indBtn').onclick = function () { renderInd(); openPop('indPop', $('indBtn')); };
$('setBtn').onclick = function () { renderSet(); openPop('setPop'); };
$('logBtn').onclick = function () { P.log = P.log ? 0 : 1; save_(true); $('logBtn').className = P.log ? 'on' : ''; if (chart) chart.priceScale('right').applyOptions({ mode: P.log ? 1 : 0 }); };
$('fitBtn').onclick = function () { if (chart) chart.timeScale().fitContent(); };
$('mask').onclick = closePops;
$('star').onclick = function () {
  if (!W || !W.login) { toast('請從 LINE 輸入「網頁」取得個人連結，才能同步追蹤清單'); return; }
  var inList = W.list.some(function (x) { return x.sym === D.info.sym; });
  run('webWatchSet', [TOKEN, D.info.key, !inList], function (w) { if (w.error) { toast('⚠️ ' + w.error); return; } W = w; MK.watch = { rows: w.list, at: Date.now() }; if (CAT === 'watch') renderList(MK.watch); renderStar(); toast(inList ? '已從追蹤清單移除' : '⭐ 已加入追蹤清單'); });
};
setInterval(tick, 8000);   // 每 8 秒更新最新價（K 棒跟著跳動）
setInterval(countdown, 1000);
window.addEventListener('resize', function () { setTimeout(placeLegends, 100); });
setInterval(function () {   // 每分鐘自動更新目前商品與清單
  if (document.hidden || !D) return;
  load(SYM, TF, { force: true, silent: true });
  if (CAT) { if (MK[CAT]) MK[CAT].at = 0; setCat(CAT); }
}, 60000);

/* ---------- 啟動 ---------- */
applyTheme(); $('ctype').value = P.ctype; if (P.bmin && innerWidth >= 820 && !VIEW0) $('bottom').classList.add('min');
if (VIEW0 && BT.some(function (b) { return b[0] === VIEW0; })) BTAB = VIEW0;   // 從卡片的「大趨勢／新聞／AI 解讀」按鈕開啟 → 直接到該分頁
renderTabs();
if (!TFP && P.dtf) TF = P.dtf;   // 沒指定週期 → 用你設定的預設週期
var SYM0 = SYM, startCat = CAT0 || (SYM ? '' : 'watch');
run('webWatch', [TOKEN], function (w) {
  W = w; MK.watch = { rows: w.list, at: Date.now() };
  if (w.pref) { var oldTf = TF; P = merge_(w.pref); if (!TFP && P.dtf && P.dtf !== oldTf && !USERTF) load(null, P.dtf); try { localStorage.setItem('iaPref', JSON.stringify(P)); } catch (e) {} applyTheme(); $('ctype').value = P.ctype; if (D) { drawChart(false); renderDetail(); } }
  if (CAT === 'watch') renderList(MK.watch); renderStar();
}, true);
if (startCat) setCat(startCat);
load(SYM || ({ us: '^GSPC', tw: '^TWII', crypto: 'BTC', fx: 'TWD=X', idx: 'DXY', cmd: 'GC=F' }[CAT0] || '2330'), TF);
window.addEventListener('resize', function () { if (D && chart) { /* autoSize 會自動調整 */ } });
</script>
</body>
</html>
